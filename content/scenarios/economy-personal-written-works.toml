seek_meals = false
goods = { paper = 1, ink = 1 }

[dynamics.social]
participants = []

[dynamics.social.rules]
interval = 1
min_health = 1
max_hunger = 100
familiarity_gain = 1
familiarity_max = 10

[writing]
paper = "paper"
ink = "ink"
page = "written-page"
paper_quantity = 1
ink_quantity = 1
next_item = 1
compositions = [
    { person = 3, topics = [{kind = "place", id = 1}, {kind = "person", id = 2}], value = 8 },
    { person = 4, words = [[1, 2], [0, 1]], value = 4 },
]

[pastimes]
catalogs = ["pastimes/literature.toml"]
activities = { "compose-song" = 1 }
minds = [
    { person = 3, interests = [{ activity = 1, value = 4 }] },
    { person = 4, interests = [{ activity = 1, value = 8 }] },
]
