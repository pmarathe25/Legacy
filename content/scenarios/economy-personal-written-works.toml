# Each writer and reader has their own sound and mark associations.
seed = 28
tick_millis = 900000
decision_period_millis = 1000
social_period_millis = 1500000
stock_capacity = 100
food_relief_divisor = 20

[rules]
hunger_per_tick = 0
meal_threshold = 5
starvation_threshold = 50
starvation_damage = 1
max_health = 100
carrying_capacity = 10
max_work_hunger = 20

[language.rules]
sounds = ["a", "k", "m"]
word_length = 2
capacity = 8

[language.writing]
capacity = 4

[[language.writing.minds]]
person = 1
associations = [{ sounds = [0, 1], marks = [91] }, { sounds = [1, 2], marks = [92] }]

[[language.writing.minds]]
person = 2
associations = [{ sounds = [2, 0], marks = [91] }]

[[language.writing.minds]]
person = 3
associations = [{ sounds = [0, 1], marks = [21] }, { sounds = [1, 2], marks = [22] }]

[[language.writing.minds]]
person = 4
associations = [{ sounds = [0, 1], marks = [31] }, { sounds = [1, 2], marks = [32] }]

[[language.minds]]
person = 1
words = [
    { meaning = { kind = "place", id = 1 }, sounds = [0, 1] },
    { meaning = { kind = "person", id = 2 }, sounds = [1, 2] },
]

[[language.minds]]
person = 2
words = [{ meaning = { kind = "person", id = 1 }, sounds = [2, 0] }]

[[language.minds]]
person = 3
words = [
    { meaning = { kind = "place", id = 1 }, sounds = [0, 1] },
    { meaning = { kind = "person", id = 2 }, sounds = [1, 2] },
]

[[language.minds]]
person = 4
words = [
    { meaning = { kind = "place", id = 1 }, sounds = [0, 1] },
    { meaning = { kind = "person", id = 2 }, sounds = [1, 2] },
]

[[regions]]
id = 1
stock = {}

[[people]]
id = 1
region = 1
health = 100
hunger = 0
willing_to_work = false
seek_meals = false
controlled = true
goods = { paper = 1, ink = 1 }

[[people]]
id = 2
region = 1
health = 100
hunger = 0
willing_to_work = false
seek_meals = false
controlled = true

[[people]]
id = 3
region = 1
health = 100
hunger = 0
willing_to_work = false
seek_meals = false
goods = { paper = 1, ink = 1 }

[[people]]
id = 4
region = 1
health = 100
hunger = 0
