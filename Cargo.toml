[workspace]
members = ["crates/game-api", "crates/game-sim", "crates/game-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
game-api = { path = "crates/game-api" }
game-sim = { path = "crates/game-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

