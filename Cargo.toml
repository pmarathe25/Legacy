[workspace]
members = ["crates/*", "tools/performance", "tools/compute"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
rayon = "1"
toml = { version = "1.1.3", default-features = false, features = ["std", "serde", "parse"] }
game-agreements = { path = "crates/game-agreements" }
game-agriculture = { path = "crates/game-agriculture" }
game-api = { path = "crates/game-api" }
game-armies = { path = "crates/game-armies" }
game-assembly = { path = "crates/game-assembly" }
game-cargo = { path = "crates/game-cargo" }
game-characters = { path = "crates/game-characters" }
game-cli = { path = "crates/game-cli" }
game-confinement = { path = "crates/game-confinement" }
game-conflict = { path = "crates/game-conflict" }
game-content = { path = "crates/game-content" }
game-core = { path = "crates/game-core" }
game-ecology = { path = "crates/game-ecology" }
game-environment = { path = "crates/game-environment" }
game-genetics = { path = "crates/game-genetics" }
game-guardians = { path = "crates/game-guardians" }
game-health = { path = "crates/game-health" }
game-institutions = { path = "crates/game-institutions" }
game-invocation = { path = "crates/game-invocation" }
game-justice = { path = "crates/game-justice" }
game-knowledge = { path = "crates/game-knowledge" }
game-land = { path = "crates/game-land" }
game-lifecycle = { path = "crates/game-lifecycle" }
game-lineage = { path = "crates/game-lineage" }
game-logistics = { path = "crates/game-logistics" }
game-missions = { path = "crates/game-missions" }
game-objects = { path = "crates/game-objects" }
game-openings = { path = "crates/game-openings" }
game-physiology = { path = "crates/game-physiology" }
game-provisioning = { path = "crates/game-provisioning" }
game-projects = { path = "crates/game-projects" }
game-property = { path = "crates/game-property" }
game-realm = { path = "crates/game-realm" }
game-relationships = { path = "crates/game-relationships" }
game-scenarios = { path = "crates/game-scenarios" }
game-session = { path = "crates/game-session" }
game-sim = { path = "crates/game-sim" }
game-storage = { path = "crates/game-storage" }
game-skills = { path = "crates/game-skills" }
game-spatial = { path = "crates/game-spatial" }
game-traits = { path = "crates/game-traits" }
game-transport = { path = "crates/game-transport" }
game-workshop = { path = "crates/game-workshop" }

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
