[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
rayon = "1"
mimalloc = "0.1.52"
toml = { version = "1.1.3", default-features = false, features = ["std", "serde", "parse"] }
game-diagnostics = { path = "crates/game-diagnostics" }

[profile.dev]
debug = 1
incremental = false

[profile.test]
# Whole-world checks exercise ordinary simulation time.
opt-level = 1
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized research builds avoid whole-workspace LTO during simulation iteration.
[profile.simulation]
inherits = "release"
lto = false
codegen-units = 16
debug = 1
