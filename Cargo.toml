[workspace]
members = ["crates/game-society", "crates/game-lineage", "crates/game-skills", "crates/game-conflict", "crates/game-invocation", "crates/game-physiology", "crates/game-health", "crates/game-characters", "crates/game-economy", "crates/game-core", "crates/game-api", "crates/game-sim", "crates/game-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
game-society = { path = "crates/game-society" }
game-lineage = { path = "crates/game-lineage" }
game-skills = { path = "crates/game-skills" }
game-conflict = { path = "crates/game-conflict" }
game-invocation = { path = "crates/game-invocation" }
game-physiology = { path = "crates/game-physiology" }
game-health = { path = "crates/game-health" }
game-characters = { path = "crates/game-characters" }
game-economy = { path = "crates/game-economy" }
game-core = { path = "crates/game-core" }
game-api = { path = "crates/game-api" }
game-sim = { path = "crates/game-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

