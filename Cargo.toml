[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized research builds avoid whole-workspace LTO during simulation iteration.
[profile.simulation]
inherits = "release"
lto = false
codegen-units = 16
debug = 1
